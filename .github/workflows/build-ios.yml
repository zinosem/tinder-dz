name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --package-lock-only && npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.json sw.js www/ 2>/dev/null || true
          cp -r *.html www/ 2>/dev/null || true

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/LoveDZ.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          cd ios/App/build/LoveDZ.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r LoveDZ-unsigned.ipa Payload
          mv LoveDZ-unsigned.ipa ../../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoveDZ-iOS
          path: ios/App/build/LoveDZ-unsigned.ipa
          retention-days: 30
